name: "Publish Immutable Action Version"

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v5
    - name: Publish
      id: publish
      uses: actions/publish-immutable-action@v0.0.4